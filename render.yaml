# backend/render.yaml
# Fichier Blueprint Render pour déploiement automatique (Infrastructure as Code)
# Documentation : https://render.com/docs/blueprint-spec

services:
  # ── SERVICE WEB NODE.JS (EXPRESS API) ──
  - type: web
    name: avs-backend
    runtime: node
    plan: free
    region: frankfurt # Idéal pour l'Afrique centrale et l'Europe
    rootDir: .
    buildCommand: npm install && npx prisma generate && npx prisma db push && node prisma/seed.js
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: avs-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: FRONTEND_URL
        value: https://agrovetoservices.cg
      - key: ADMIN_EMAIL
        value: admin@agrovetoservices.cg
      - key: ADMIN_PASSWORD
        generateValue: true

# ── BASE DE DONNÉES POSTGRESQL MANIPULÉE PAR PRISMA ──
databases:
  - name: avs-postgres
    plan: free
    region: frankfurt
    databaseName: avs_db
    user: avs_user
